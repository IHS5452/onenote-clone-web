<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OneNote Web Clone by Ian Schrauth</title>
  
  <!-- External Libraries -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #f3f3f3;
      --sidebar-bg: #e8e8e8;
      --editor-bg: #ffffff;
      --text-color: #333333;
      --border-color: #d1d1d1;
      --accent-color: #7719aa;
      --accent-hover: #5c1385;
      --active-item: #dcdcdc;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e1e;
      --sidebar-bg: #252526;
      --editor-bg: #1e1e1e;
      --text-color: #cccccc;
      --border-color: #3c3c3c;
      --accent-color: #a855f7;
      --accent-hover: #9333ea;
      --active-item: #37373d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; overflow: hidden; }

    /* Layout */
    .app-container { display: flex; width: 100%; height: 100vh; }
    .sidebar { width: 250px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-weeks { border-right: 1px solid var(--border-color); }
    .main-editor { flex: 1; background: var(--editor-bg); display: flex; flex-direction: column; overflow-y: auto; }

    /* Header Controls */
    .sidebar-header { padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .sidebar-title { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; color: var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
    select, button, input { font-size: 0.85rem; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--editor-bg); color: var(--text-color); }
    button { cursor: pointer; background: var(--accent-color); color: white; border: none; }
    button:hover { background: var(--accent-hover); }

    /* Item Lists */
    .item-list { list-style: none; overflow-y: auto; flex: 1; }
    .item-list li { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .item-list li:hover { background: var(--active-item); }
    .item-list li.active { background: var(--active-item); font-weight: bold; border-left: 4px solid var(--accent-color); }
    .delete-icon { opacity: 0.5; font-size: 0.8rem; }
    .delete-icon:hover { opacity: 1; color: red; }

    /* Toolbar & Editor */
    .toolbar { padding: 8px 15px; border-bottom: 1px solid var(--border-color); display: none; gap: 6px; flex-wrap: wrap; background: var(--sidebar-bg); }
    .toolbar button { background: var(--editor-bg); color: var(--text-color); border: 1px solid var(--border-color); }
    .toolbar button:hover { background: var(--active-item); }
    
    .editor-wrapper { padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }
    .page-title { font-size: 2rem; font-weight: bold; border: none; outline: none; width: 100%; background: transparent; color: var(--text-color); margin-bottom: 5px; }
    .page-datetime { font-size: 0.8rem; opacity: 0.6; margin-bottom: 20px; }
    .page-body { min-height: 400px; outline: none; font-size: 1rem; line-height: 1.6; }

    /* Modals & Empty States */
    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; opacity: 0.5; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--editor-bg); padding: 20px; border-radius: 8px; width: 350px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Subjects Column -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button id="btn-open-folder">Open Root Folder</button>
        <select id="select-recents"></select>
        <div class="sidebar-title">
          <span>Subjects</span>
          <button id="btn-add-subject">+</button>
        </div>
        <button id="btn-import-md" style="background:#4a5568;">Import MD Files</button>
        <input type="file" id="input-import-md" multiple accept=".md" style="display:none;" />
      </div>
      <ul id="list-subjects" class="item-list"></ul>
      <div style="padding: 10px; border-top: 1px solid var(--border-color);">
        <button id="btn-about" style="width:100%; background:transparent; color:var(--text-color); border:1px solid var(--border-color);">About</button>
      </div>
    </div>

    <!-- Weeks Column -->
    <div class="sidebar sidebar-weeks">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>Weeks</span>
          <button id="btn-add-week">+</button>
        </div>
      </div>
      <ul id="list-weeks" class="item-list"></ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-editor">
      <div id="toolbar" class="toolbar">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')"><s>S</s></button>
        <button onclick="execCmdArg('formatBlock', '<h1>')">H1</button>
        <button onclick="execCmdArg('formatBlock', '<h2>')">H2</button>
        <button onclick="execCmd('insertUnorderedList')">• List</button>
        <button onclick="execCmd('insertOrderedList')">1. List</button>
        <button onclick="insertLink()">Link</button>
        <button onclick="insertImage()">Image</button>
        <div style="margin-left: auto; display: flex; gap: 5px;">
          <select id="export-format">
            <option value="docx">.docx</option>
            <option value="pdf">.pdf</option>
            <option value="md">.md</option>
            <option value="txt">.txt</option>
          </select>
          <button id="btn-save">Export</button>
        </div>
      </div>

      <div id="empty-state" class="empty-state">
        <p>Select or create a week to start editing</p>
      </div>

      <div id="editor-content" class="editor-wrapper" style="display:none;">
        <input type="text" id="page-title" class="page-title" placeholder="Untitled Week" />
        <div id="page-datetime" class="page-datetime"></div>
        <div id="page-body" class="page-body" contenteditable="true"></div>
      </div>
    </div>
  </div>

  <!-- Subject Decision Modal -->
  <div id="import-modal" class="modal">
    <div class="modal-content">
      <h3>Import Markdown Files</h3>
      <p>Would you like to import into the currently selected subject or a new subject?</p>
      <button id="btn-import-use-current">Use Selected Subject</button>
      <hr/>
      <input type="text" id="input-import-new-subject" placeholder="New Subject Name" />
      <button id="btn-import-use-new">Create & Import to New</button>
      <button id="btn-import-cancel" style="background:gray;">Cancel</button>
    </div>
  </div>

  <!-- About Modal -->
  <div id="about-modal" class="modal">
    <div class="modal-content">
      <h3>About OneNote Web Clone</h3>
      <p>Developer Contact: <span id="dev-email">contact@ianschrauth.com</span></p>
      <div style="display:flex; gap:10px;">
        <button id="btn-copy-email">Copy</button>
        <button id="modal-close" style="background:gray;">Close</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
